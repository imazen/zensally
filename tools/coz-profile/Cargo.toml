[package]
name = "zensally-coz-profile"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
coz = "0.1.3"
zensally = { path = "../../crates/zensally" }

[profile.release]
debug = 1
lto = "thin"

# Compile the actual core crate root and its unchanged unit tests, without
# resolving inference backends. Optional serde/zenlayout tests are not enabled.
[[test]]
name = "core_unit"
path = "../../crates/zensally/src/lib.rs"

[dev-dependencies]
archmage = { version = "0.9.32", default-features = false }
magetypes = { version = "0.9.32", default-features = false, features = ["w512"] }
magemath = { version = "0.1", default-features = false }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("std", "serde", "zenlayout", "zenpixels"))'] }

[patch.crates-io]
# Target imazen/archmage main (pre-0.9.33 / magemath pre-0.1.1).
archmage = { git = "https://github.com/imazen/archmage", rev = "cb55badf4d4e07f825e1873c021de95560b28136" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "cb55badf4d4e07f825e1873c021de95560b28136" }
magemath = { git = "https://github.com/imazen/archmage", rev = "cb55badf4d4e07f825e1873c021de95560b28136" }
