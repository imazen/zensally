[package]
name = "zensally-coz-profile"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
coz = "0.1.3"
zensally = { path = "../../crates/zensally" }

[profile.release]
debug = 1
lto = "thin"

# Compile the actual core crate root and its unchanged unit tests, without
# resolving inference backends. Optional serde/zenlayout tests are not enabled.
[[test]]
name = "core_unit"
path = "../../crates/zensally/src/lib.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde", "zenlayout"))'] }
