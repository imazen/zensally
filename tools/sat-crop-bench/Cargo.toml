[package]
name = "sat-crop-bench"
version = "0.0.0"
edition = "2024"
publish = false

# Detached tool package: lives outside the parent workspace so it can
# #[path]-include zensally's crate-private modules without widening the
# published API.
[workspace]

# The #[path]-included zensally modules contain `#[cfg_attr(feature =
# "serde", ...)]` derives gated on zensally's own `serde` feature. This
# package does not declare that feature, so tell check-cfg the name is
# expected rather than dropping the cfg_attrs from the shared sources.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("serde"))'] }

# The lib is only a shim for the #[path]-included modules — don't run it as
# a bench/test target (its libtest harness would reject `--quick`).
[lib]
test = false
bench = false

[dependencies]
archmage = "0.9.31"
magetypes = { version = "0.9.31", default-features = false, features = ["w512"] }
zensally = { path = "../../crates/zensally", features = ["zenlayout"] }

[dev-dependencies]
zenbench = "0.1.11"
# eval_crop_v2 example: ONNX runtimes + JPEG/PNG I/O for the real-image
# v0.1-vs-v0.2 comparison. Deps here keep the bench lib shim minimal.
zensally-tract = { path = "../../crates/zensally-tract", features = ["ultraface", "yunet", "microsalnet", "selfie_seg"] }
zensally-micro = { path = "../../crates/zensally-micro" }
zenlayout = { version = "0.2.2", features = ["smart-crop"] }
tract-onnx = { version = "0.23.10", default-features = false }
zenflate = { version = "0.4.1", default-features = false }
enough = "0.4.5"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
# eval_corpus_v2 example: parallel corpus eval + JSON emission. Tool-only
# deps — crates/zensally stays at zero core dependencies.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"

[[bench]]
name = "sat_crop_bench"
harness = false
