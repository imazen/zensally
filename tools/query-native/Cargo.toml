[package]
name = "zensally-native-query-study"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]
resolver = "3"

[features]
default = ["simd"]
simd = ["zenpredict/simd"]

[dependencies]
zenpredict = { version = "0.2.0", default-features = false, features = ["std"] }

[build-dependencies]
serde_json = "1.0.154"
# Unpublished owned build-time crate: supply the frozen source patch explicitly.
zenpredict-bake = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
