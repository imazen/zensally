[package]
name = "zensally-residual-head-study"
version = "0.0.0"
edition = "2024"
rust-version = "1.98"
publish = false

[workspace]
resolver = "3"

[dependencies]
zenpredict = { version = "0.2.0", default-features = false, features = ["std", "simd"] }

[build-dependencies]
serde_json = "1.0.154"
zenpredict-bake = "0.1.0"

[profile.release]
lto = "thin"
codegen-units = 1
