<!doctype html><meta charset="utf-8"><title>Source content coverage</title>
<style>body{margin:16px;font:14px system-ui;background:#171a20;color:#eee}h1{font-size:22px;margin:0}p{margin:8px 0}select{font:inherit}#tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}article{padding:8px;background:#292e38;min-width:0}img{width:100%;height:270px;object-fit:contain;background:#111}a{color:#9cf}small{display:block;overflow-wrap:anywhere}.id{font-size:16px;font-weight:bold}</style>
<h1>Photographic fit/development content audit</h1>
<p>Source previews only. Unknown face coverage; no automatic labels or artistic grades. TEST excluded. <label>Sheet <select id="sheet"></select></label></p><main id="tiles"></main>
<script>
const data=/*DATA*/null;const sheet=document.getElementById('sheet'),tiles=document.getElementById('tiles');
for(let i=0;i<Math.ceil(data.sources.length/10);i++){const option=document.createElement('option');option.value=i;option.textContent=(i+1)+' / '+Math.ceil(data.sources.length/10);sheet.append(option)}
function render(){tiles.replaceChildren();for(const row of data.sources.filter(r=>r.sheet===Number(sheet.value))){const article=document.createElement('article');article.dataset.id=row.id;const image=document.createElement('img');image.src=row.preview;image.alt=row.id;article.append(image);const id=document.createElement('p');id.className='id';id.textContent=row.index+' · '+row.source.provider_id;article.append(id);const text=document.createElement('small');text.textContent=row.role+' · '+row.native_size.join(' × ')+' · '+row.family_id;article.append(text);const link=document.createElement('a');link.href=row.source.source_url;link.textContent='Original source';article.append(link);tiles.append(article)}}
if(data.dataset_kind==='owned-screening'){document.title='Supplementary screening-only content';document.querySelector('h1').textContent='Supplementary photographic content screen'}sheet.onchange=render;render();
</script>
