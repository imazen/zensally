<!doctype html><meta charset="utf-8"><title>Source content coverage</title>
<style>body{margin:16px;font:14px system-ui;background:#171a20;color:#eee}h1{font-size:22px;margin:0}p{margin:8px 0}select{font:inherit}#tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}article{padding:8px;background:#292e38;min-width:0}img{width:100%;height:270px;object-fit:contain;background:#111}a{color:#9cf}small{display:block;overflow-wrap:anywhere}.id{font-size:16px;font-weight:bold}</style>
<h1>Photographic fit/development content audit</h1>
<p>Source previews only. Unknown face coverage; no automatic labels or artistic grades. TEST excluded. <label>Sheet <select id="sheet"></select></label></p><main id="tiles"></main>
<script>
const data=/*DATA*/null;const sheet=document.getElementById('sheet'),tiles=document.getElementById('tiles');
const sheetSize=data.sheet_size||10,displayHeight=data.preview_display_height||270;if(data.columns)tiles.style.gridTemplateColumns='repeat('+data.columns+',1fr)';
for(let i=0;i<Math.ceil(data.sources.length/sheetSize);i++){const option=document.createElement('option');option.value=i;option.textContent=(i+1)+' / '+Math.ceil(data.sources.length/sheetSize);sheet.append(option)}
function render(){tiles.replaceChildren();for(const row of data.sources.filter(r=>r.sheet===Number(sheet.value))){const article=document.createElement('article');article.dataset.id=row.id;const image=document.createElement('img');image.src=row.preview;image.alt=row.id;image.style.height=displayHeight+'px';if(row.regions){const frame=document.createElement('div');frame.style.cssText='position:relative;height:'+displayHeight+'px';frame.append(image);const ns='http://www.w3.org/2000/svg',overlay=document.createElementNS(ns,'svg');overlay.setAttribute('viewBox','0 0 '+row.preview_size.join(' '));overlay.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';for(const box of row.regions){const r=document.createElementNS(ns,'rect');r.dataset.box=JSON.stringify(box);for(const[name,value]of Object.entries({x:box[0]/row.native_size[0]*row.preview_size[0],y:box[1]/row.native_size[1]*row.preview_size[1],width:(box[2]-box[0])/row.native_size[0]*row.preview_size[0],height:(box[3]-box[1])/row.native_size[1]*row.preview_size[1],fill:'none',stroke:'#ffdc36','stroke-width':2,'vector-effect':'non-scaling-stroke'}))r.setAttribute(name,value);overlay.append(r)}frame.append(overlay);article.append(frame)}else article.append(image);const id=document.createElement('p');id.className='id';id.textContent=row.index+' · '+row.source.provider_id;article.append(id);const text=document.createElement('small');text.textContent=row.role+' · '+row.native_size.join(' × ')+' · '+row.family_id;article.append(text);if(row.query){const query=document.createElement('p');query.textContent=row.query+(row.reference_unknown?' · UNKNOWN: '+row.reference_unknown:'');article.append(query)}const link=document.createElement('a');link.href=row.source.source_url;link.textContent='Original source';article.append(link);tiles.append(article)}}
if(data.dataset_kind==='owned-screening'){document.title='Supplementary screening-only content';document.querySelector('h1').textContent='Supplementary photographic content screen'}sheet.onchange=render;render();
if(data.dataset_kind==='photo-subjects'){document.title='Weak local subject references';document.querySelector('h1').textContent='Weak phrase-grounded subject references';document.querySelector('p').firstChild.textContent='Machine query boxes, not complete subjects, face certificates or artistic labels. TEST excluded. '}
</script>

<script>if(data.dataset_kind==='miap-fit-dev'){document.title='People-pilot content review';document.querySelector('h1').textContent='Human person annotations: fit/development content review';document.querySelector('p').firstChild.textContent='All sources remain unadmitted. Caption/relationship flags are review hints. Group records are not individual counts; faces are uncertified. TEST excluded. '}</script>
