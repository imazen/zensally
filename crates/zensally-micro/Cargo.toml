[package]
name = "zensally-micro"
version = "0.1.0"
edition.workspace = true
rust-version = "1.93"
license.workspace = true
description = "Fixed-graph MicroSalNet w24 inference experiment"
publish = false

[features]
default = []
std = ["zenjpegai/std", "archmage/std", "magetypes/std"]
avx512 = ["zenjpegai/avx512", "archmage/avx512", "magetypes/avx512"]
# Study-only alternatives apply to the opt-in fast path; the ordered path stays intact.
experimental-reassociate = []
# Rust 1.98+ is required only when this feature is selected.
experimental-algebraic = ["experimental-reassociate"]

[dependencies]
zensally = { path = "../zensally", version = "0.1.0", default-features = false }
zenjpegai = { git = "https://github.com/imazen/zenjpegai", rev = "084fadeb0b62309593dbc216f591ca6b73865a4f", default-features = false, features = ["unstable-internals"] }
zenflate = { version = "0.4.1", default-features = false }
enough = { version = "0.4.5", default-features = false }
archmage = { version = ">=0.9.31-beta.2, <0.10.0", default-features = false, features = ["macros"] }
magetypes = { version = ">=0.9.31-beta.2, <0.10.0", default-features = false }
libm = "0.2.16"

[dev-dependencies]
zenbench = "0.1.11"
tract-onnx = { version = "0.23.10", default-features = false }
zenlayout = { version = "0.2.2", default-features = false, features = ["std", "smart-crop"] }
zenpng = { version = "0.2.0", default-features = false }
zenpixels = { version = ">=0.3.1, <0.5.0", default-features = false }
codec-corpus = "1.1.0"
sha2 = "0.11.1"

[[bench]]
name = "w24"
harness = false
