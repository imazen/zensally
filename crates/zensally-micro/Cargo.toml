[package]
name = "zensally-micro"
version = "0.1.0"
edition.workspace = true
rust-version = "1.93"
license.workspace = true
description = "Fixed-graph MicroSalNet w24 inference experiment"
publish = false

[features]
default = ["std"]
std = ["zenjpegai/std"]
avx512 = ["zenjpegai/avx512", "archmage/avx512", "magetypes/avx512"]

[dependencies]
zensally.workspace = true
zenjpegai = { git = "https://github.com/imazen/zenjpegai", rev = "ee48e318edd2f0572b756c41afd421b6bcb5d605", default-features = false, features = ["unstable-internals"] }
zenflate = { version = "0.4.1", default-features = false }
enough = { version = "0.4.5", default-features = false }
archmage = { version = ">=0.9.31-beta.2, <0.10.0", features = ["macros"] }
magetypes = { version = ">=0.9.31-beta.2, <0.10.0" }
libm = "0.2.16"

[dev-dependencies]
zenbench = "0.1.11"
tract-onnx = { version = "0.23.10", default-features = false }
zenlayout = { version = "0.2.2", default-features = false, features = ["std", "smart-crop"] }
zenpng = { version = "0.2.0", default-features = false }
zenpixels = { version = ">=0.3.1, <0.5.0", default-features = false }
codec-corpus = "1.1.0"
sha2 = "0.11.1"

[[bench]]
name = "w24"
harness = false
