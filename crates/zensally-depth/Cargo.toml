[package]
name = "zensally-depth"
version = "0.1.0"
edition.workspace = true
rust-version = "1.93"
license.workspace = true
description = "Embedded JPEG/HEIC depth cues for content-aware cropping"
repository = "https://github.com/imazen/zensally"
publish = false

[features]
default = ["std", "jpeg", "heic"]
std = ["zencodec/std"]
jpeg = ["std", "dep:zenjpeg", "dep:zenpng"]
heic = ["std", "dep:heic"]

[dependencies]
zensally.workspace = true
zencodec = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272", default-features = false }
zenjpeg = { git = "https://github.com/imazen/zenjpeg", rev = "cae3a9f38786803a20575474792ead2a7d418f3b", default-features = false, features = ["decoder", "metadata"], optional = true }
heic = { git = "https://github.com/imazen/heic", rev = "4d72caddb4c1d664237a8d3693f35d69ac80caaf", default-features = false, features = ["backend-rust", "std"], optional = true }
zenpng = { version = "0.2.0", default-features = false, optional = true }
zenpixels = { version = ">=0.3.1, <0.5.0", default-features = false }
enough = "0.4.5"

[dev-dependencies]
zenbench = "0.1.11"
