[package]
name = "zenfaces-tract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "BlazeFace face detection via tract (pure Rust ONNX inference)"

[features]
default = ["mediapipe"]
mediapipe = []
blazeface320 = []

[dependencies]
zenfaces = { workspace = true }
tract-onnx = "0.22"
anyhow = "1"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg"] }
