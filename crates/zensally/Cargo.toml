[package]
name = "zensally"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fast pure-Rust face detection and saliency for smart image cropping"

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
zenlayout = ["dep:zenlayout"]

[dependencies]
serde = { version = "1", features = ["derive"], optional = true }
zenlayout = { path = "../../../zenlayout", default-features = false, features = ["smart-crop", "alloc"], optional = true }
