[package]
name = "zensally"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fast pure-Rust face detection and saliency for smart image cropping"
readme = "../../README.crates.md"
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]

[features]
default = ["std"]
std = []
serde = ["dep:serde"]
zenlayout = ["dep:zenlayout"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"], optional = true }
zenlayout = { version = "0.2.2", default-features = false, features = ["smart-crop", "alloc"], optional = true }

[dev-dependencies]
zenbench = "0.1.7"

[[bench]]
name = "preprocess"
harness = false
