[package]
name = "zensally-tract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Face detection and saliency via tract (pure Rust ONNX inference)"
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]

[features]
default = ["ultraface"]
mediapipe = []
blazeface320 = []
yunet = []
ultraface = []
u2netp = []
selfie_seg = []
microsalnet = []
analyzer = ["ultraface", "microsalnet"]

[dependencies]
zensally = { workspace = true }
# Pinned to the sonos/tract commit that fixes tract-linalg's build.rs on
# aarch64-pc-windows-msvc (cl.exe ignores the ARM64 .S kernels, D9024, and
# the MASM comment-stripping corrupts the GAS source) — sonos/tract#2718,
# merged 2026-08-25, ships in tract 0.23.6. A [patch.crates-io] override is
# not possible: cargo will not match the 0.23.6-pre git version against a
# ^0.23.5 requirement. Switch back to `tract-onnx = "0.23.6"` once it is on
# crates.io. Tracking: https://github.com/imazen/zensally/issues/1
tract-onnx = { git = "https://github.com/sonos/tract", rev = "9f6e40611e345ff46481388d4d2c591e5e91a278" }
anyhow = "1"
zenflate = { git = "https://github.com/imazen/zenflate", default-features = false }
enough = "0.4.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
criterion = { version = "0.8", features = ["html_reports"] }
zenlayout = { version = "0.2", features = ["smart-crop"] }

[[example]]
name = "eval_crop"
required-features = ["ultraface", "microsalnet"]

[[example]]
name = "eval_crop_holdout"
required-features = ["ultraface", "microsalnet"]

[[example]]
name = "eval_saliency"
required-features = ["u2netp"]

[[example]]
name = "eval_selfie_seg"
required-features = ["selfie_seg"]

[[example]]
name = "eval_microsalnet"
required-features = ["microsalnet"]

[[example]]
name = "bench_mediapipe_e2e"
required-features = ["mediapipe"]

[[example]]
name = "bench_selfie_seg"
required-features = ["selfie_seg"]

[[example]]
name = "bench_u2netp"
required-features = ["u2netp"]

[[bench]]
name = "face_bench"
harness = false
required-features = ["mediapipe"]
