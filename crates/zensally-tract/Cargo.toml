[package]
name = "zensally-tract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Face detection and saliency via tract (pure Rust ONNX inference)"

[features]
default = ["ultraface"]
mediapipe = []
blazeface320 = []
yunet = []
ultraface = []
u2netp = []
selfie_seg = []
microsalnet = []
analyzer = ["ultraface", "microsalnet"]

[dependencies]
zensally = { workspace = true }
tract-onnx = "0.22"
anyhow = "1"
zenflate = { git = "https://github.com/imazen/zenflate", default-features = false }
enough = "0.4.3"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
criterion = { version = "0.8", features = ["html_reports"] }
zenlayout = { path = "../../../zenlayout", features = ["smart-crop"] }

[[example]]
name = "eval_crop"
required-features = ["ultraface", "microsalnet"]

[[example]]
name = "eval_crop_holdout"
required-features = ["ultraface", "microsalnet"]

[[example]]
name = "eval_saliency"
required-features = ["u2netp"]

[[example]]
name = "eval_selfie_seg"
required-features = ["selfie_seg"]

[[example]]
name = "eval_microsalnet"
required-features = ["microsalnet"]

[[example]]
name = "bench_mediapipe_e2e"
required-features = ["mediapipe"]

[[example]]
name = "bench_selfie_seg"
required-features = ["selfie_seg"]

[[example]]
name = "bench_u2netp"
required-features = ["u2netp"]

[[bench]]
name = "face_bench"
harness = false
required-features = ["mediapipe"]
