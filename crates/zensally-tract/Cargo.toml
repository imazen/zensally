[package]
name = "zensally-tract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Face detection and saliency via tract (pure Rust ONNX inference)"

[features]
default = ["ultraface"]
mediapipe = []
blazeface320 = []
yunet = []
ultraface = []
u2netp = []
selfie_seg = []
microsalnet = []
analyzer = ["ultraface", "microsalnet"]

[dependencies]
zensally = { workspace = true }
tract-onnx = "0.22"
anyhow = "1"
zenflate = { git = "https://github.com/imazen/zenflate", default-features = false }
enough = "0.4"

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "face_bench"
harness = false
