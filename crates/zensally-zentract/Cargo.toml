[package]
name = "zensally-zentract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Face detection and saliency via zentract ONNX plugin (no tract compile dependency)"
exclude = [
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]

[features]
default = ["ultraface", "microsalnet"]
ultraface = []
microsalnet = []
analyzer = ["ultraface", "microsalnet"]

[dependencies]
zensally = { workspace = true }
zentract-api = { git = "https://github.com/imazen/zentract" }
zenflate = { git = "https://github.com/imazen/zenflate", default-features = false }
enough = "0.4.3"
anyhow = "1.0.104"
