[package]
name = "zensally-zentract"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Face detection and saliency via zentract ONNX plugin (no tract compile dependency)"
exclude = [
    "docs/",
    "apidoc/",
    "CLAUDE.md",
    "CONTEXT-HANDOFF.md",
    "FEEDBACK.md",
    ".claude/",
    ".superwork/",
    ".zenbench/",
    "copter-report/",
    ".github/",
    "Cross.toml",
    "justfile",
    "Cargo.toml.original.txt",
    "fuzz/",
]

[features]
default = ["ultraface", "microsalnet"]
ultraface = []
microsalnet = []
analyzer = ["ultraface", "microsalnet"]

[dependencies]
zensally = { workspace = true }
zentract-api = { git = "https://github.com/imazen/zentract", rev = "5f33cefc" }
zenflate = { version = "0.4.1", default-features = false }
enough = "0.4.5"
anyhow = "1.0.104"
