name: Native reduced ORT deployment

on:
  workflow_dispatch:
    inputs:
      architecture:
        type: choice
        default: both
        options: [both, x64, arm64]

permissions:
  contents: read

jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install onnxruntime==1.31.1 onnx==1.23.2 flatbuffers==25.12.19
      - run: python tools/ort-native/prepare.py model
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: native-model
          path: model/
  windows:
    needs: model
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(inputs.architecture == 'arm64' && '["arm64"]' || inputs.architecture == 'x64' && '["x64"]' || '["x64","arm64"]') }}
    runs-on: ${{ matrix.arch == 'arm64' && 'windows-11-arm' || 'windows-latest' }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        with:
          arch: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8.0.2
        with:
          name: native-model
          path: native/model
      - name: Configure disk scratch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$HOME/tmp/native-ort" | Out-Null
          "TMPDIR=$HOME/tmp/native-ort" >> $env:GITHUB_ENV
          "TEMP=$HOME/tmp/native-ort" >> $env:GITHUB_ENV
          "TMP=$HOME/tmp/native-ort" >> $env:GITHUB_ENV
      - run: python -m pip install flatbuffers==25.12.19 ninja
      - name: Build static runtime and both probes
        run: python tools/ort-native/windows.py build native --arch ${{ matrix.arch }}
      - name: Prove native single-file deployment
        run: python tools/ort-native/windows.py prove native --arch ${{ matrix.arch }}
      - name: Install benchmark driver
        run: cargo install zenbench --version 0.1.11 --locked --bin zenbench --no-default-features --features cli
      - name: Paired numerical and timing checks
        run: python tools/ort-native/bench.py native
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: native-${{ matrix.arch }}
          path: |
            native/deployment.json
            native/dependencies.txt
            native/standalone.stdout
            native/plan.json
            native/pair/
            native/build/native-build-identity.json
            native/build/MinSizeRel/ort-native-*.exe
            native/model/
          if-no-files-found: warn
