name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - macos-26-intel
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Use clang assembler (windows-11-arm only)
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: echo "CC=clang" >> "$GITHUB_ENV"

      - name: Patch path deps for CI
        shell: bash
        run: |
          # zenlayout is published; strip path override in dev-deps
          sed \
            -e 's|path = "\.\./\.\./\.\./zenlayout"|version = "0.2"|g' \
            crates/zensally-tract/Cargo.toml > crates/zensally-tract/Cargo.toml.ci \
            && mv crates/zensally-tract/Cargo.toml.ci crates/zensally-tract/Cargo.toml
          # zentract is a private repo; exclude zensally-zentract from workspace
          # zentract is a private repo; exclude zensally-zentract from workspace
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's|"crates/zensally-zentract",||g' Cargo.toml
          else
            sed -i 's|"crates/zensally-zentract",||g' Cargo.toml
          fi
          rm -f Cargo.lock

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (blazeface320)
        run: cargo test --workspace --features blazeface320

      - name: Test (mediapipe)
        run: cargo test --workspace --features mediapipe

      - name: Test (yunet)
        run: cargo test --workspace --features yunet

      - name: Test (analyzer)
        run: cargo test --workspace --features analyzer

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed \
            -e 's|path = "\.\./\.\./\.\./zenlayout"|version = "0.2"|g' \
            crates/zensally-tract/Cargo.toml > crates/zensally-tract/Cargo.toml.ci \
            && mv crates/zensally-tract/Cargo.toml.ci crates/zensally-tract/Cargo.toml
          # zentract is a private repo; exclude zensally-zentract from workspace
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's|"crates/zensally-zentract",||g' Cargo.toml
          else
            sed -i 's|"crates/zensally-zentract",||g' Cargo.toml
          fi
          rm -f Cargo.lock

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all feature flags)
        run: cargo clippy --workspace --all-targets --features "blazeface320,mediapipe,yunet,analyzer" -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed \
            -e 's|path = "\.\./\.\./\.\./zenlayout"|version = "0.2"|g' \
            crates/zensally-tract/Cargo.toml > crates/zensally-tract/Cargo.toml.ci \
            && mv crates/zensally-tract/Cargo.toml.ci crates/zensally-tract/Cargo.toml
          # zentract is a private repo; exclude zensally-zentract from workspace
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's|"crates/zensally-zentract",||g' Cargo.toml
          else
            sed -i 's|"crates/zensally-zentract",||g' Cargo.toml
          fi
          rm -f Cargo.lock

      - name: Check MSRV
        run: cargo hack check --rust-version --workspace

  wider-face:
    name: WIDER FACE Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed \
            -e 's|path = "\.\./\.\./\.\./zenlayout"|version = "0.2"|g' \
            crates/zensally-tract/Cargo.toml > crates/zensally-tract/Cargo.toml.ci \
            && mv crates/zensally-tract/Cargo.toml.ci crates/zensally-tract/Cargo.toml
          # zentract is a private repo; exclude zensally-zentract from workspace
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's|"crates/zensally-zentract",||g' Cargo.toml
          else
            sed -i 's|"crates/zensally-zentract",||g' Cargo.toml
          fi
          rm -f Cargo.lock

      - name: Install gdown
        run: pip install gdown

      - name: Cache WIDER FACE dataset
        uses: actions/cache@v4
        with:
          path: data/wider_face
          key: wider-face-val-v1

      - name: Download WIDER FACE
        run: bash scripts/download_wider_face.sh

      - name: Run validation
        run: cargo run --package zensally-tract --example wider_validate --release
