name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (blazeface320)
        run: cargo clippy --workspace --all-targets --features blazeface320 -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (blazeface320)
        run: cargo test --workspace --features blazeface320

      - name: Bench (quick)
        run: cargo bench --package zenfaces-tract --bench face_bench -- --quick

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Check (blazeface320)
        run: cargo check --workspace --all-targets --features blazeface320
