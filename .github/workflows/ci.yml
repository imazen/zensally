name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # `github.head_ref` is set ONLY on pull_request events. On a push it is
  # empty, so the group fell through to `github.run_id` — unique per run,
  # so pushes never collided and nothing was ever cancelled. `github.ref`
  # is set on both event types (`refs/heads/main` on push,
  # `refs/pull/N/merge` on a PR), so PR behaviour is unchanged while
  # consecutive pushes to a branch now supersede each other.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-latest
          - windows-latest
          - windows-11-arm
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          # zenlayout is published; strip path override in dev-deps
          sed \
            -e 's|path = "\.\./\.\./\.\./zenlayout"|version = "0.2"|g' \
            crates/zensally-tract/Cargo.toml > crates/zensally-tract/Cargo.toml.ci \
            && mv crates/zensally-tract/Cargo.toml.ci crates/zensally-tract/Cargo.toml
          # zentract is a private repo; exclude zensally-zentract from workspace
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's|"crates/zensally-zentract",||g' Cargo.toml
          else
            sed -i 's|"crates/zensally-zentract",||g' Cargo.toml
          fi
          rm -f Cargo.lock

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (blazeface320)
        run: cargo test --workspace --features blazeface320

      - name: Test (mediapipe)
        run: cargo test --workspace --features mediapipe

      - name: Test (yunet)
        run: cargo test --workspace --features yunet

      - name: Test (all features)
        run: cargo test --workspace --all-features

  test-i686:
    name: Test (i686 via cross)
    runs-on: ubuntu-latest
    env:
      CODEC_CORPUS_CACHE: .external-cache
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
      - name: Exclude optional private plugin host
        run: sed -i 's|"crates/zensally-zentract",||g' Cargo.toml
      - name: Test (all features, i686)
        run: cross test --workspace --all-features --target i686-unknown-linux-gnu

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed \
            -e 's|path = "\.\./\.\./\.\./zenlayout"|version = "0.2"|g' \
            crates/zensally-tract/Cargo.toml > crates/zensally-tract/Cargo.toml.ci \
            && mv crates/zensally-tract/Cargo.toml.ci crates/zensally-tract/Cargo.toml
          # zentract is a private repo; exclude zensally-zentract from workspace
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's|"crates/zensally-zentract",||g' Cargo.toml
          else
            sed -i 's|"crates/zensally-zentract",||g' Cargo.toml
          fi
          rm -f Cargo.lock

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all feature flags)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format check
        run: cargo fmt --all -- --check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-hack
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed \
            -e 's|path = "\.\./\.\./\.\./zenlayout"|version = "0.2"|g' \
            crates/zensally-tract/Cargo.toml > crates/zensally-tract/Cargo.toml.ci \
            && mv crates/zensally-tract/Cargo.toml.ci crates/zensally-tract/Cargo.toml
          # zentract is a private repo; exclude zensally-zentract from workspace
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's|"crates/zensally-zentract",||g' Cargo.toml
          else
            sed -i 's|"crates/zensally-zentract",||g' Cargo.toml
          fi
          rm -f Cargo.lock

      - name: Check MSRV
        run: cargo hack check --rust-version --workspace
      - name: Install bare-metal target
        run: rustup target add aarch64-unknown-none
      - name: Check libraries without a standard library
        run: cargo check -p zensally-depth -p zensally-micro --no-default-features --target aarch64-unknown-none

  wider-face:
    name: WIDER FACE Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Patch path deps for CI
        shell: bash
        run: |
          sed \
            -e 's|path = "\.\./\.\./\.\./zenlayout"|version = "0.2"|g' \
            crates/zensally-tract/Cargo.toml > crates/zensally-tract/Cargo.toml.ci \
            && mv crates/zensally-tract/Cargo.toml.ci crates/zensally-tract/Cargo.toml
          # zentract is a private repo; exclude zensally-zentract from workspace
          if [[ "$OSTYPE" == "darwin"* ]]; then
            sed -i '' 's|"crates/zensally-zentract",||g' Cargo.toml
          else
            sed -i 's|"crates/zensally-zentract",||g' Cargo.toml
          fi
          rm -f Cargo.lock

      - name: Install gdown
        run: pip install gdown

      - name: Cache WIDER FACE dataset
        uses: actions/cache@v6
        with:
          path: data/wider_face
          key: wider-face-val-v1

      - name: Download WIDER FACE
        run: bash scripts/download_wider_face.sh

      - name: Run validation
        run: cargo run --package zensally-tract --example wider_validate --release
