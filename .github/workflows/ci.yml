name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (blazeface320)
        run: cargo clippy --workspace --all-targets --features blazeface320 -- -D warnings

      - name: Test (default features)
        run: cargo test --workspace

      - name: Test (blazeface320)
        run: cargo test --workspace --features blazeface320

      - name: Bench (quick)
        run: cargo bench --package zensally-tract --bench face_bench -- --quick

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2

      - name: Check
        run: cargo check --workspace --all-targets

      - name: Check (blazeface320)
        run: cargo check --workspace --all-targets --features blazeface320

  wider-face:
    name: WIDER FACE Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install gdown
        run: pip install gdown

      - name: Cache WIDER FACE dataset
        uses: actions/cache@v4
        with:
          path: data/wider_face
          key: wider-face-val-v1

      - name: Download WIDER FACE
        run: bash scripts/download_wider_face.sh

      - name: Run validation
        run: cargo run --package zensally-tract --example wider_validate --release
