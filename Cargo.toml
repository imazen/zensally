[workspace]
# resolver 3 is MSRV-aware: it prefers dependency versions whose rust-version
# fits ours instead of the newest release (the MSRV CI job deletes Cargo.lock).
resolver = "3"
members = [
    "crates/zensally",
    "crates/zensally-tract",
    "crates/zensally-zentract",
    "crates/zensally-depth",
]

[workspace.package]
edition = "2024"
# tract 0.23 requires 1.91.
rust-version = "1.91"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"

[workspace.dependencies]
zensally = { path = "crates/zensally" , version = "0.1.0" }

# Current codec mains require the unpublished 0.2 contract and 0.3 pixel family.
# Keep the same git source for every registry edge; dependency patches do not propagate.
[patch.crates-io]
zencodec = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zencodec-io = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zencodec-coroutine = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zencodec-testkit = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "fa836abf72afe9826e866dc25712b7c800323962" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "85cc309c07526341e6fa8b7e4d6130aaf64c8fea" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "02a7f0df5f72dd79b0afa58d66ced7cdd8395e31" }
zenflate = { git = "https://github.com/imazen/zenflate", rev = "a0ea03637a2cc9a193e343018ae2cfb1a6c31edd" }
