[workspace]
# resolver 3 is MSRV-aware: it prefers dependency versions whose rust-version
# fits ours instead of the newest release (the MSRV CI job deletes Cargo.lock).
resolver = "3"
members = [
    "crates/zensally",
    "crates/zensally-micro",
    "crates/zensally-tract",
    "crates/zensally-zentract",
]

[workspace.package]
edition = "2024"
# tract 0.23 requires 1.91.
rust-version = "1.91"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"

[workspace.dependencies]
zensally = { path = "crates/zensally" , version = "0.2.0" }
zensally-micro = { path = "crates/zensally-micro", version = "0.2.0" }

[patch.crates-io]
# archmage/magetypes PR #168 (#[attune], min/max_fast, to_i32_fast, RGB block ops, mul_add_lane4_relaxed).
archmage = { git = "https://github.com/imazen/archmage", rev = "d2b6748369616828f9650ea0e307e913f3f8a268" }
magetypes = { git = "https://github.com/imazen/archmage", rev = "d2b6748369616828f9650ea0e307e913f3f8a268" }
