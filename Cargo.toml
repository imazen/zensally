[workspace]
# resolver 3 is MSRV-aware: it prefers dependency versions whose rust-version
# fits ours instead of the newest release (the MSRV CI job deletes Cargo.lock).
resolver = "3"
members = [
    "crates/zensally",
    "crates/zensally-tract",
    "crates/zensally-zentract",
    "crates/zensally-depth",
    "crates/zensally-micro",
]

[workspace.package]
edition = "2024"
# tract 0.23 requires 1.91.
rust-version = "1.91"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"

[workspace.dependencies]
zensally = { path = "crates/zensally" , version = "0.1.0" }

# Current codec mains require the unpublished 0.2 contract and 0.3 pixel family.
# Keep the same git source for every registry edge; dependency patches do not propagate.
[patch.crates-io]
# Heatmap mass placement and integer bounds fixes, verified by crop regressions.
zenlayout = { git = "https://github.com/imazen/zenpipe", rev = "6ed32dea4df1d086b5674dbbc54e53aada14c3f5" }
zencodec = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zenmeta = { git = "https://github.com/imazen/zencodec", rev = "1fb997bb88e7405e6a315bf1f0b22f71e99be272" }
zenpixels = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }
zenpixels-convert = { git = "https://github.com/imazen/zenpixels", rev = "fde59b96632557592cffa9b7301acd8db96ed078" }
ultrahdr-core = { git = "https://github.com/imazen/ultrahdr", rev = "174b1aff22b76ce2f8963e221edb94b50f84d823" }
zenpng = { git = "https://github.com/imazen/zenpng", rev = "559faa9d35d844fa1f7af5a8c9f13ee6819c5fc2" }
zenflate = { git = "https://github.com/imazen/zenflate", rev = "878cf35c70e3c3e0b63bac0d855de710f9f7f430" }

# Pixel cohort's published beta-compatible operation entry points.
garb = { git = "https://github.com/imazen/garb", rev = "605276d717ea0b31a1cd2a36ae05301383c7b8b5" }
linear-srgb = { git = "https://github.com/imazen/linear-srgb", rev = "52896f4b24664315586bd60e5f048253b1f69052" }

zentone = { git = "https://github.com/imazen/zentone", rev = "4b5ab710157743e3018b7de3a79f336c2f61113e" }
