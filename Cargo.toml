[workspace]
resolver = "2"
members = [
    "crates/zensally",
    "crates/zensally-tract",
    "crates/zensally-zentract",
]

[workspace.package]
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only OR LicenseRef-Imazen-Commercial"

[workspace.dependencies]
zensally = { path = "crates/zensally" }
